<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AKS BlobFuse with Microsoft Entra Workload Identity architecture</title>
  <desc id="desc">An NGINX pod in AKS mounts an Azure Blob container through a static persistent volume and the Azure Blob CSI driver. The driver uses a Kubernetes service account token, the AKS OIDC issuer, a federated identity credential, and a user-assigned managed identity to access storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="entra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4aff"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183b56" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078d4"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7655d9"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#16825d"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #52677d; }
      .zone-title { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #17365d; }
      .zone-subtitle { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #64788c; }
      .node-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }
      .node-text { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #60758a; }
      .edge-label { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #334e68; }
      .step { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .legend { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #40566d; }
      .card { fill: white; stroke: #cfdae6; stroke-width: 1.5; filter: url(#shadow); }
      .zone { fill: white; stroke-width: 2; filter: url(#shadow); }
      .data { fill: none; stroke: #0078d4; stroke-width: 3; marker-end: url(#arrow-blue); }
      .identity { fill: none; stroke: #7655d9; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .auth { fill: none; stroke: #16825d; stroke-width: 3; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="64" y="62" class="title">AKS BlobFuse with Workload Identity</text>
  <text x="64" y="92" class="subtitle">Passwordless, token-only access from a Kubernetes workload to Azure Blob Storage</text>

  <!-- Legend -->
  <g transform="translate(1110 48)">
    <line x1="0" y1="0" x2="45" y2="0" class="data"/>
    <text x="58" y="5" class="legend">Storage data path</text>
    <line x1="0" y1="28" x2="45" y2="28" class="identity"/>
    <text x="58" y="33" class="legend">OIDC token flow</text>
    <line x1="245" y1="0" x2="290" y2="0" class="auth"/>
    <text x="303" y="5" class="legend">RBAC authorization</text>
  </g>

  <!-- AKS zone -->
  <rect x="55" y="135" width="800" height="690" rx="24" class="zone" stroke="#2b88d8"/>
  <rect x="55" y="135" width="800" height="72" rx="24" fill="#e8f3fc"/>
  <path d="M55 183h800v24H55z" fill="#e8f3fc"/>
  <g transform="translate(82 153)">
    <path d="M24 0 45 12v24L24 48 3 36V12z" fill="#0078d4"/>
    <circle cx="24" cy="24" r="11" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="24" cy="24" r="3.5" fill="white"/>
    <path d="M24 8v8M24 32v8M8 24h8M32 24h8M13 13l6 6M29 29l6 6M35 13l-6 6M19 29l-6 6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="145" y="170" class="zone-title">Azure Kubernetes Service</text>
  <text x="145" y="193" class="zone-subtitle">OIDC issuer + Workload Identity enabled · Azure Blob CSI driver enabled</text>

  <!-- Pod card -->
  <rect x="95" y="245" width="285" height="205" rx="18" class="card"/>
  <rect x="95" y="245" width="285" height="44" rx="18" fill="#f3f8fc"/>
  <path d="M95 270h285v19H95z" fill="#f3f8fc"/>
  <g transform="translate(118 307)">
    <path d="M49 0 91 24v48L49 96 7 72V24z" fill="#326ce5"/>
    <circle cx="49" cy="48" r="22" fill="none" stroke="white" stroke-width="5"/>
    <circle cx="49" cy="48" r="6" fill="white"/>
    <path d="M49 17v16M49 63v16M18 48h16M64 48h16M27 27l11 11M60 59l11 11M71 27 60 38M38 59 27 70" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="220" y="274" class="node-title">NGINX workload pod</text>
  <text x="220" y="324" class="node-text">Writes timestamps to</text>
  <text x="220" y="344" class="node-text">/mnt/blob/outfile</text>
  <text x="220" y="379" class="node-text">BlobFuse volume mount</text>
  <text x="220" y="399" class="node-text">ReadWriteMany</text>
  <rect x="118" y="416" width="238" height="24" rx="12" fill="#e8f3fc"/>
  <text x="237" y="433" text-anchor="middle" class="node-text">serviceAccountName: service-account-01</text>

  <!-- PV/PVC card -->
  <rect x="475" y="245" width="330" height="205" rx="18" class="card"/>
  <g transform="translate(505 278)">
    <ellipse cx="42" cy="14" rx="36" ry="12" fill="#0078d4"/>
    <path d="M6 14v58c0 7 16 13 36 13s36-6 36-13V14c0 7-16 13-36 13S6 21 6 14z" fill="#50a7e5"/>
    <path d="M6 42c0 7 16 13 36 13s36-6 36-13M6 67c0 7 16 13 36 13s36-6 36-13" fill="none" stroke="white" stroke-opacity=".75" stroke-width="2"/>
  </g>
  <text x="610" y="288" class="node-title">Static PV + PVC</text>
  <text x="610" y="318" class="node-text">pv-blob ↔ pvc-blob</text>
  <text x="610" y="340" class="node-text">azureblob-fuse-premium</text>
  <text x="610" y="362" class="node-text">BlobFuse protocol</text>
  <rect x="505" y="398" width="270" height="30" rx="8" fill="#eaf7f2"/>
  <text x="640" y="418" text-anchor="middle" class="node-text">mountWithWorkloadIdentityToken: true</text>

  <!-- CSI driver -->
  <rect x="475" y="525" width="330" height="170" rx="18" class="card"/>
  <g transform="translate(505 557)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="#0078d4"/>
    <path d="M20 22h40v10H20zm0 18h40v10H20zm0 18h26v10H20z" fill="white"/>
    <circle cx="61" cy="63" r="12" fill="#50e6ff" stroke="white" stroke-width="3"/>
  </g>
  <text x="610" y="563" class="node-title">Azure Blob CSI driver</text>
  <text x="610" y="592" class="node-text">blob.csi.azure.com</text>
  <text x="610" y="614" class="node-text">Requests projected SA token</text>
  <text x="610" y="636" class="node-text">Uses clientID from PV attributes</text>
  <rect x="505" y="653" width="270" height="24" rx="12" fill="#f0ebff"/>
  <text x="640" y="670" text-anchor="middle" class="node-text">No workload identity webhook required</text>

  <!-- Service account -->
  <rect x="95" y="535" width="285" height="150" rx="18" class="card"/>
  <g transform="translate(120 568)">
    <circle cx="38" cy="26" r="22" fill="#326ce5"/>
    <path d="M5 85c3-26 18-39 33-39s30 13 33 39z" fill="#8ab4f8"/>
    <path d="M61 60h25v10H61zm17-8h10v26H78z" fill="#7655d9"/>
  </g>
  <text x="220" y="570" class="node-title">Kubernetes ServiceAccount</text>
  <text x="220" y="600" class="node-text">service-account-01</text>
  <text x="220" y="622" class="node-text">Subject is matched by the FIC</text>
  <text x="220" y="653" class="node-text">No client-id annotation required</text>

  <!-- Identity zone -->
  <rect x="900" y="135" width="645" height="330" rx="24" class="zone" stroke="#7655d9"/>
  <rect x="900" y="135" width="645" height="72" rx="24" fill="#f1edff"/>
  <path d="M900 183h645v24H900z" fill="#f1edff"/>
  <g transform="translate(927 151)">
    <path d="M25 0 50 14v28L25 56 0 42V14z" fill="url(#entra)"/>
    <circle cx="25" cy="20" r="8" fill="white"/>
    <path d="M10 43c2-12 8-18 15-18s13 6 15 18z" fill="white"/>
  </g>
  <text x="995" y="170" class="zone-title">Microsoft Entra Workload Identity</text>
  <text x="995" y="193" class="zone-subtitle">Kubernetes-to-Azure federation without secrets</text>

  <rect x="935" y="245" width="165" height="155" rx="16" class="card"/>
  <g transform="translate(985 267)">
    <circle cx="32" cy="32" r="29" fill="#0078d4"/>
    <circle cx="32" cy="32" r="17" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="32" cy="32" r="4" fill="white"/>
    <path d="M32 3v12M32 49v12M3 32h12M49 32h12" stroke="white" stroke-width="3"/>
  </g>
  <text x="1017" y="351" text-anchor="middle" class="node-title">AKS OIDC issuer</text>
  <text x="1017" y="375" text-anchor="middle" class="node-text">Signs SA token</text>

  <rect x="1140" y="245" width="165" height="155" rx="16" class="card"/>
  <g transform="translate(1191 267)">
    <path d="M31 2 61 19v34L31 70 1 53V19z" fill="#7655d9"/>
    <path d="M17 36h28M31 22v28" stroke="white" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="1222" y="351" text-anchor="middle" class="node-title">Federated credential</text>
  <text x="1222" y="375" text-anchor="middle" class="node-text">Matches SA subject</text>

  <rect x="1345" y="245" width="165" height="155" rx="16" class="card"/>
  <g transform="translate(1398 267)">
    <circle cx="30" cy="22" r="17" fill="#0078d4"/>
    <path d="M3 68c2-24 13-36 27-36s25 12 27 36z" fill="#50a7e5"/>
    <circle cx="53" cy="51" r="13" fill="#16825d" stroke="white" stroke-width="3"/>
    <path d="M48 51l4 4 8-9" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1427" y="351" text-anchor="middle" class="node-title">Managed identity</text>
  <text x="1427" y="375" text-anchor="middle" class="node-text">identity-wi</text>

  <!-- Storage zone -->
  <rect x="900" y="505" width="645" height="320" rx="24" class="zone" stroke="#16825d"/>
  <rect x="900" y="505" width="645" height="72" rx="24" fill="#eaf7f2"/>
  <path d="M900 553h645v24H900z" fill="#eaf7f2"/>
  <g transform="translate(930 520)">
    <ellipse cx="28" cy="9" rx="25" ry="8" fill="#0078d4"/>
    <path d="M3 9v39c0 5 11 9 25 9s25-4 25-9V9c0 5-11 9-25 9S3 14 3 9z" fill="#50a7e5"/>
    <path d="M3 28c0 5 11 9 25 9s25-4 25-9" fill="none" stroke="white" stroke-width="2"/>
  </g>
  <text x="1000" y="540" class="zone-title">Azure Storage</text>
  <text x="1000" y="563" class="zone-subtitle">Private data plane access controlled with Azure RBAC</text>

  <rect x="965" y="625" width="245" height="145" rx="18" class="card"/>
  <g transform="translate(995 654)">
    <ellipse cx="42" cy="11" rx="37" ry="11" fill="#0078d4"/>
    <path d="M5 11v62c0 7 17 12 37 12s37-5 37-12V11c0 7-17 12-37 12S5 18 5 11z" fill="#50a7e5"/>
    <path d="M5 39c0 7 17 12 37 12s37-5 37-12M5 64c0 7 17 12 37 12s37-5 37-12" fill="none" stroke="white" stroke-width="2"/>
  </g>
  <text x="1100" y="660" class="node-title">Storage account</text>
  <text x="1100" y="687" class="node-text">Premium BlockBlobStorage</text>
  <text x="1100" y="709" class="node-text">LRS · ADLS Gen2 (HNS)</text>
  <text x="1100" y="731" class="node-text">Storage Blob Data Contributor</text>

  <rect x="1275" y="625" width="220" height="145" rx="18" class="card"/>
  <g transform="translate(1304 654)">
    <path d="M4 16h70v62H4z" fill="#0078d4"/>
    <path d="M4 16 18 3h70L74 16z" fill="#50a7e5"/>
    <path d="M74 16 88 3v62L74 78z" fill="#0063b1"/>
    <path d="M26 41c0-9 7-16 16-16 7 0 13 4 15 11 8 0 14 6 14 14 0 8-6 14-14 14H27c-7 0-13-5-13-12 0-6 5-11 12-11z" fill="white" opacity=".95"/>
  </g>
  <text x="1400" y="660" class="node-title">Private blob container</text>
  <text x="1400" y="687" class="node-text">container-01</text>
  <text x="1400" y="709" class="node-text">outfile stored as a block blob</text>
  <text x="1400" y="731" class="node-text">No Kubernetes secret</text>

  <!-- Internal data arrows -->
  <path d="M380 348H465" class="data"/>
  <circle cx="423" cy="330" r="12" fill="#0078d4"/><text x="423" y="334" text-anchor="middle" class="step">1</text>
  <text x="423" y="373" text-anchor="middle" class="edge-label">mounts PVC</text>

  <path d="M640 450V515" class="data"/>
  <circle cx="660" cy="483" r="12" fill="#0078d4"/><text x="660" y="487" text-anchor="middle" class="step">2</text>
  <text x="705" y="487" class="edge-label">NodePublishVolume</text>

  <path d="M475 610H390" class="identity"/>
  <circle cx="430" cy="590" r="12" fill="#7655d9"/><text x="430" y="594" text-anchor="middle" class="step">3</text>
  <text x="430" y="637" text-anchor="middle" class="edge-label">request SA token</text>

  <!-- Cross-zone identity flow -->
  <path d="M380 610 C680 610,730 322,925 322" class="identity"/>
  <circle cx="865" cy="335" r="12" fill="#7655d9"/><text x="865" y="339" text-anchor="middle" class="step">4</text>
  <rect x="690" y="302" width="170" height="27" rx="13" fill="white" stroke="#d8cef8"/>
  <text x="775" y="320" text-anchor="middle" class="edge-label">projected OIDC token</text>

  <path d="M1100 322H1130" class="identity"/>
  <path d="M1305 322H1335" class="identity"/>
  <circle cx="1320" cy="302" r="12" fill="#7655d9"/><text x="1320" y="306" text-anchor="middle" class="step">5</text>
  <text x="1222" y="426" text-anchor="middle" class="edge-label">Entra validates issuer, audience, and subject</text>

  <!-- Authorization -->
  <path d="M1427 400 C1427 490,1130 500,1100 615" class="auth"/>
  <circle cx="1320" cy="490" r="12" fill="#16825d"/><text x="1320" y="494" text-anchor="middle" class="step">6</text>
  <rect x="1162" y="470" width="150" height="27" rx="13" fill="white" stroke="#b8dfd1"/>
  <text x="1237" y="488" text-anchor="middle" class="edge-label">Azure RBAC</text>

  <!-- Data plane -->
  <path d="M805 610 C870 610,885 697,955 697" class="data"/>
  <circle cx="875" cy="650" r="12" fill="#0078d4"/><text x="875" y="654" text-anchor="middle" class="step">7</text>
  <rect x="820" y="671" width="130" height="27" rx="13" fill="white" stroke="#b9d8ee"/>
  <text x="885" y="689" text-anchor="middle" class="edge-label">OAuth token</text>
  <path d="M1210 697H1265" class="data"/>
  <text x="1238" y="683" text-anchor="middle" class="edge-label">Blob API</text>

  <!-- Footer -->
  <text x="64" y="866" class="node-text">Token-only mode: the CSI driver authenticates with the projected ServiceAccount token; no storage key or Kubernetes Secret is used.</text>
  <text x="1536" y="866" text-anchor="end" class="node-text">Azure architecture · AKS BlobFuse demo</text>
</svg>
